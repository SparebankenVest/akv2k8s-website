name: publish docs

permissions:
  contents: write

on:
  push:
    branches:
    - master
    - 'v*'

jobs:
  build-deploy-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '10.19.x'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Build
      env:
        GATSBY_SKIP_PRINTER: 'true'
      run: |
        npm i
        node scripts/patch-gatsby-printer.js
        grep -q -- "--no-sandbox" node_modules/gatsby-plugin-printer/run-screenshots.js
        grep -q -- "GATSBY_SKIP_PRINTER" node_modules/gatsby-plugin-printer/gatsby-node.js
        node scripts/build-and-exit.js

    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./public
